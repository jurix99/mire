# Site protégé : chaque page est validée par le backend (session LinkedIn)
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/mime.types;

    # Dev local : le navigateur revalide toujours les fichiers
    add_header Cache-Control "no-cache" always;

    # Redirections relatives (sinon nginx écrit http://localhost/... sans le port 8080)
    absolute_redirect off;

    # Toute requête doit avoir une session valide
    auth_request /_auth_check;
    error_page 401 = @login;

    location = /_auth_check {
        internal;
        proxy_pass http://backend:8000/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location @login {
        return 302 /auth/login?next=$uri;
    }

    # Routes du backend (login, callback LinkedIn, logout, /auth/me) : publiques
    location /auth/ {
        auth_request off;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API JSON : le backend vérifie lui-même la session (répond 401 en JSON, pas de redirection)
    location /api/ {
        auth_request off;
        client_max_body_size 2m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Dev-User "";   # jamais d'accès "dev" sans login sur ce port
    }

    # URLs propres : /entreprises -> entreprises.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}

# Accès direct sans login (dev local uniquement, publié sur 127.0.0.1:8081)
server {
    listen 81;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/mime.types;
    add_header Cache-Control "no-cache" always;
    absolute_redirect off;

    location /api/ {
        client_max_body_size 2m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Dev-User "1";  # le backend utilise l'utilisateur "dev" (si DEV_LOGIN_BYPASS)
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
