<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entreprises · Mire</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/favicon.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/app.css">
  <script type="module" src="/assets/js/entreprises.js"></script>
</head>
<body>
  <div class="layout">
    <aside id="sidebar" class="sidebar"></aside>
    <main class="main">
      <header class="page-head">
        <div class="intro">
          <p class="label">// Votre radar</p>
          <h1>Entreprises</h1>
          <p class="muted">Les startups qui ont levé et que vous suivez.</p>
        </div>
        <button class="btn" type="button" id="add" data-admin>Ajouter une entreprise</button>
      </header>

      <div id="pro-banner"></div>
      <div class="toolbar">
        <input class="input" type="search" id="search" placeholder="Rechercher une entreprise, un secteur…" aria-label="Rechercher" style="flex:1;max-width:360px">
        <select id="sector" aria-label="Secteur"></select>
        <select id="sort" aria-label="Trier">
          <option value="name">Nom (A → Z)</option>
          <option value="recent">Levée la plus récente</option>
          <option value="amount">Montant levé</option>
          <option value="jobs">Nombre de postes</option>
        </select>
        <span class="small muted" id="count"></span>
      </div>

      <div class="cards" id="list"></div>
    </main>
  </div>
</body>
</html>
