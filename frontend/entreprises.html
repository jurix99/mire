<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entreprises · Mire</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/favicon.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/app.css">
  <script type="module" src="/assets/js/entreprises.js"></script>
</head>
<body>
  <div class="layout">
    <aside id="sidebar" class="sidebar"></aside>
    <main class="main">
      <header class="page-head">
        <div class="intro">
          <h1>Entreprises</h1>
          <p class="muted">Celles qui recrutent pour vous. Aimez-les pour les faire remonter, écartez les autres.</p>
        </div>
        <button class="btn ghost" type="button" id="add" data-admin>Ajouter une entreprise</button>
      </header>

      <div id="pro-banner"></div>

      <nav class="tabs" role="tablist" aria-label="Vues" id="views">
        <button type="button" role="tab" data-view="pour-vous">Pour vous <span class="n"></span></button>
        <button type="button" role="tab" data-view="aimees">J'aime <span class="n"></span></button>
        <button type="button" role="tab" data-view="ecartees">Écartées <span class="n"></span></button>
      </nav>

      <div class="toolbar filters">
        <input class="input search" type="search" id="q" placeholder="Entreprise, secteur, investisseur…" aria-label="Rechercher">
        <select id="f-secteur" aria-label="Secteur"></select>
        <select id="f-stade" aria-label="Stade"></select>
        <label class="check small" id="f-all-wrap"><input type="checkbox" id="f-all"> Aussi sans offre pour moi</label>
      </div>

      <div class="list-head">
        <span class="small muted" id="count"></span>
        <select id="sort" class="small" aria-label="Trier">
          <option value="match">Les plus pertinentes</option>
          <option value="recent">Levée la plus récente</option>
          <option value="name">Nom (A → Z)</option>
        </select>
      </div>

      <div class="cards" id="list"></div>
    </main>
  </div>
</body>
</html>
