<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analytics · Mire</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/favicon.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/app.css">
  <script type="module" src="/assets/js/analytics.js"></script>
</head>
<body>
  <div class="layout">
    <aside id="sidebar" class="sidebar"></aside>
    <main class="main">
      <header class="page-head">
        <div class="intro">
          <p class="label">// Prendre du recul</p>
          <h1>Analytics</h1>
          <p class="muted">Ce que recrutent les startups financées, où vous vous situez, et votre recherche.</p>
        </div>
      </header>

      <nav class="tabs" role="tablist" aria-label="Onglets Analytics">
        <button type="button" role="tab" id="tabbtn-marche" aria-controls="tab-marche" data-tab="marche">Marché</button>
        <button type="button" role="tab" id="tabbtn-moi" aria-controls="tab-moi" data-tab="moi">Toi face au marché</button>
        <button type="button" role="tab" id="tabbtn-suivi" aria-controls="tab-suivi" data-tab="suivi">Mon suivi</button>
      </nav>

      <!-- Marché : agrégats précalculés, filtrables -->
      <section id="tab-marche" role="tabpanel" aria-labelledby="tabbtn-marche" hidden>
        <div class="mk-bar">
          <select id="m-period" aria-label="Période"></select>
          <span class="small muted" id="m-perimeter"></span>
        </div>

        <h2 class="mk-title">Qui recrute</h2>
        <div class="market-grid" id="m-who"></div>

        <div class="mk-title-row">
          <h2 class="mk-title">Par métier</h2>
          <div class="seg" id="m-domains" role="group" aria-label="Métier"></div>
        </div>
        <div class="market-grid" id="m-domain-cards"></div>

        <h2 class="mk-title">Après la levée</h2>
        <div class="market-grid" id="m-funding"></div>

        <!-- Administrateurs -->
        <div class="card pad-lg section" id="m-engine" hidden></div>
        <div class="card pad-lg section" id="m-beta" hidden></div>
        <div class="card pad-lg section" id="m-health" hidden></div>
      </section>

      <!-- Toi face au marché (Pro) -->
      <section id="tab-moi" role="tabpanel" aria-labelledby="tabbtn-moi" hidden>
        <p class="small muted perimeter" id="me-scope"></p>
        <div class="market-grid" id="me-cards"></div>
      </section>

      <!-- Mon suivi : l'ancienne page Analytics, inchangée -->
      <section id="tab-suivi" role="tabpanel" aria-labelledby="tabbtn-suivi" hidden>
        <section class="grid-2">
          <div class="card pad-lg">
            <div class="section-head"><h2>Répartition par statut</h2></div>
            <div class="bars" id="by-status"></div>
          </div>
          <div class="card pad-lg">
            <div class="section-head"><h2>Entonnoir</h2><span class="small muted" id="rate"></span></div>
            <div class="funnel" id="funnel"></div>
          </div>
        </section>

        <section class="section grid-2">
          <div class="card pad-lg">
            <div class="section-head"><h2>Activité</h2><span class="small muted">Changements de statut par semaine</span></div>
            <div class="weeks" id="weeks"></div>
          </div>
          <div class="card pad-lg">
            <div class="section-head"><h2>Par entreprise</h2></div>
            <div class="rows" id="by-company"></div>
          </div>
        </section>
      </section>
    </main>
  </div>
</body>
</html>
