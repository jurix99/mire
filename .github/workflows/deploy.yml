# Déploiement en production (Azure Container Apps), à chaque push sur main :
# 1. images mire-api et mire-worker (linux/amd64) poussées sur GHCR, tag = SHA court + latest ;
# 2. connexion à Azure en OIDC (aucun secret) ;
# 3. terraform apply en deux temps : d'abord le job mire-migrate seul (nouvelle image), exécution des
#    migrations et attente du succès, puis l'apply complet (mire-api, mire-daily, mire-worker) ;
# 4. test de fumée : /healthz et /readyz sur l'URL publique.
#
# L'image est changée par Terraform (variables api_image_tag / worker_image_tag), pas par
# `az containerapp update` : le state reste la seule source de vérité, et un apply suivant ne revient
# jamais à une ancienne image.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # relancer un déploiement (ex. après avoir posé les secrets, voir la doc)

permissions:
  contents: read

# Jamais deux déploiements en parallèle ; celui en cours va au bout
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  images:
    name: Images (GHCR)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # GITHUB_TOKEN pousse sur ghcr.io
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: tag
        id: meta
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: mire-api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: api
          platforms: linux/amd64
          push: true
          build-args: ASSET_VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/mire-api:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.owner }}/mire-api:latest
          cache-from: type=gha,scope=mire-api
          cache-to: type=gha,mode=max,scope=mire-api
      - name: mire-worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: worker
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/mire-worker:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.owner }}/mire-worker:latest
          cache-from: type=gha,scope=mire-worker
          cache-to: type=gha,mode=max,scope=mire-worker

  deploy:
    name: Terraform apply + migrations
    needs: images
    runs-on: ubuntu-24.04
    environment: prod # identifiant fédéré repo:<dépôt>:environment:prod
    permissions:
      contents: read
      id-token: write # OIDC
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      TF_IN_AUTOMATION: "true"
      TF_VAR_api_image_tag: ${{ needs.images.outputs.tag }}
      TF_VAR_worker_image_tag: ${{ needs.images.outputs.tag }}
      TF_VAR_apps_enabled: ${{ vars.MIRE_APPS_ENABLED || 'false' }}
      TF_VAR_custom_domain: ${{ vars.MIRE_CUSTOM_DOMAIN }}
      TF_VAR_budget_alert_email: ${{ secrets.BUDGET_ALERT_EMAIL }}
      TF_VAR_billing_enabled: ${{ vars.BILLING_ENABLED || 'false' }}
      TF_VAR_stripe_price_monthly: ${{ vars.STRIPE_PRICE_MONTHLY }}
      TF_VAR_stripe_price_pass_3m: ${{ vars.STRIPE_PRICE_PASS_3M }}
      TF_VAR_pro_user_emails: ${{ secrets.PRO_USER_EMAILS }}
      TF_VAR_admin_emails: ${{ secrets.ADMIN_EMAILS }}
      RESOURCE_GROUP: rg-mire-prod
      APPS_ENABLED: ${{ vars.MIRE_APPS_ENABLED || 'false' }}
    defaults:
      run:
        working-directory: infra/main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: init
        run: terraform init -input=false -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"

      # 3.1 Le job de migration seul, avec la nouvelle image (et ce dont il dépend)
      - name: apply (mire-migrate)
        if: env.APPS_ENABLED == 'true'
        run: terraform apply -input=false -auto-approve -target=azurerm_container_app_job.migrate

      # 3.2 Migrations AVANT la nouvelle API : on attend la fin (succès obligatoire)
      - name: migrations
        if: env.APPS_ENABLED == 'true'
        working-directory: .
        run: |
          az extension add --name containerapp --upgrade --yes --only-show-errors
          execution=$(az containerapp job start -n mire-migrate -g "$RESOURCE_GROUP" --query name -o tsv)
          echo "Exécution : $execution"
          for i in $(seq 1 90); do
            status=$(az containerapp job execution show -n mire-migrate -g "$RESOURCE_GROUP" \
              --job-execution-name "$execution" --query properties.status -o tsv)
            echo "Statut : $status"
            case "$status" in
              Succeeded) exit 0 ;;
              Failed|Stopped|Degraded) echo "::error::Migrations en échec (journaux : docs/deploiement-azure.md)"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Migrations : délai dépassé (15 min)"
          exit 1

      # 3.3 Tout le reste : mire-api, mire-daily, mire-worker (et l'infra au premier déploiement)
      - name: apply
        run: terraform apply -input=false -auto-approve

      # Sur le nom *.azurecontainerapps.io : toujours valide, même avant la liaison du certificat du domaine
      - name: test de fumée
        if: env.APPS_ENABLED == 'true'
        run: |
          url="https://$(terraform output -raw api_fqdn)"
          for path in /healthz /readyz; do
            curl -fsS --retry 12 --retry-delay 10 --retry-all-errors --max-time 30 "$url$path"
            echo
          done
