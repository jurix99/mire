services:
  # Front (HTML/CSS/JS du dossier frontend/) servi par nginx, protégé par le backend
  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"             # site avec connexion LinkedIn
      - "127.0.0.1:8081:81"   # accès direct SANS login, pour le dev local uniquement
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  # Backend FastAPI (uv) : connexion LinkedIn OpenID Connect + session + API /api
  backend:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    working_dir: /app
    # Applique les migrations de la base, puis démarre l'API
    command: >
      sh -c "uv run --frozen alembic upgrade head &&
             uv run --frozen uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    env_file: .env
    environment:
      PUBLIC_URL: http://localhost:8080
      DATABASE_URL: postgresql+psycopg://jobradar:${POSTGRES_PASSWORD:-jobradar}@db:5432/jobradar
      SEED_DEMO: "true"               # entreprises/postes de démo si la base est vide + process de démo par nouvel utilisateur
      DEV_LOGIN_BYPASS: "true"        # l'accès sans login du port 8081 utilise un utilisateur "dev"
      UV_PROJECT_ENVIRONMENT: /venv   # venv dans un volume Docker, pas dans le dossier Windows
      UV_NATIVE_TLS: "1"              # uv utilise les certificats système (proxy HTTPS de l'entreprise)
      UV_LINK_MODE: copy
    volumes:
      - ./backend:/app
      - backend-venv:/venv
      - uv-cache:/root/.cache/uv
      # Certificats racines de WSL (inclut la CA Cloudflare Gateway du réseau de l'entreprise)
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Base PostgreSQL (données dans le volume postgres-data)
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jobradar
      POSTGRES_USER: jobradar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobradar}
    ports:
      - "127.0.0.1:5432:5432"   # pour un client SQL local (DBeaver, psql...)
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobradar -d jobradar"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  backend-venv:
  uv-cache:
  postgres-data:
