[project]
name = "incredible-info-backend"
version = "0.1.0"
description = "Backend du site job radar : authentification LinkedIn (OpenID Connect) + API + PostgreSQL"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "itsdangerous>=2.2",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "python-multipart>=0.0.18",
    "google-genai>=3.5.0",
    "pypdf>=7.1.1",
    "stripe>=17.1.0",
    "pgvector>=0.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
worker = [
    "fastembed>=0.7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "postgres: exige PostgreSQL + pgvector (TEST_POSTGRES_URL), sinon ignoré",
]
