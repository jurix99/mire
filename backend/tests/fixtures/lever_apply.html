<!DOCTYPE html>
<html>
<head><title>Acme - Backend Engineer</title><style>.application-question input{font:14px Meta}</style></head>
<body>
<div class="section-wrapper page-full-width">
<form id="application-form" action="/acme/0f2b8e6a-1111-4c2d-9e2a-5b6c7d8e9f00/apply" method="POST" enctype="multipart/form-data">
  <input type="hidden" name="accountId" value="abc">
  <div class="section page-centered application-form">
    <h4>Submit your application</h4>
    <ul>
      <li class="application-question resume"><label><div class="application-label">Resume/CV <span class="required">✱</span></div>
        <div class="application-field"><a href="#" class="postings-btn template-btn-utility visible-resume-upload">ATTACH RESUME/CV</a>
        <input class="application-file-input invisible-resume-upload" data-qa="input-resume" id="resume-upload-input" name="resume" tabindex="-1" type="file"></div></label></li>
      <li class="application-question"><label><div class="application-label">Full name<span class="required">✱</span></div>
        <div class="application-field"><input type="text" data-qa="name-input" name="name" required></div></label></li>
      <li class="application-question"><label><div class="application-label">Email<span class="required">✱</span></div>
        <div class="application-field"><input name="email" data-qa="email-input" type="email" required></div></label></li>
      <li class="application-question"><label><div class="application-label">Phone </div>
        <div class="application-field"><input type="text" data-qa="phone-input" name="phone"></div></label></li>
      <li class="application-question"><label><div class="application-label">Current location <span class="required">✱</span></div>
        <div class="application-field"><input class="location-input" type="text" maxlength="100" name="location" required></div></label></li>
      <li class="application-question"><label><div class="application-label">Current company </div>
        <div class="application-field"><input type="text" data-qa="org-input" name="org"></div></label></li>
    </ul>
  </div>
  <div class="section page-centered application-form">
    <h4>Links</h4>
    <ul>
      <li class="application-question"><label><div class="application-label">LinkedIn URL </div>
        <div class="application-field"><input type="text" name="urls[LinkedIn]"></div></label></li>
      <li class="application-question"><label><div class="application-label">GitHub URL </div>
        <div class="application-field"><input type="text" name="urls[GitHub]"></div></label></li>
    </ul>
  </div>
  <div class="section page-centered application-form">
    <input type="hidden" name="cards[a69a985a-eae9-4c14-90fb-b5a4b891523e][baseTemplate]" value="{&quot;text&quot;:&quot;Questions&quot;}">
    <ul>
      <li class="application-question custom-question"><div><div class="application-label full-width multiple-select"><div class="text">Language Skill(s) (Check all that apply)<span class="required">✱</span></div></div>
        <div class="application-field full-width required-field"><ul data-qa="checkboxes">
          <li><label><input type="checkbox" name="cards[a69a985a-eae9-4c14-90fb-b5a4b891523e][field0]" value="English (ENG)" /><span class="application-answer-alternative">English (ENG)</span></label></li>
          <li><label><input type="checkbox" name="cards[a69a985a-eae9-4c14-90fb-b5a4b891523e][field0]" value="French (FRA)" /><span class="application-answer-alternative">French (FRA)</span></label></li>
          <li><label><input type="checkbox" name="cards[a69a985a-eae9-4c14-90fb-b5a4b891523e][field0]" value="German (DEU)" /><span class="application-answer-alternative">German (DEU)</span></label></li>
        </ul></div></div></li>
      <li class="application-question custom-question"><div><div class="application-label full-width multiple-choice"><div class="text">Are you legally authorized to work in France?<span class="required">✱</span></div></div>
        <div class="application-field full-width required-field"><ul data-qa="multiple-choice">
          <li><label><input type="radio" name="cards[1c719ca9-5069-4afe-9e82-39ca00000000][field0]" value="Yes" /><span class="application-answer-alternative">Yes</span></label></li>
          <li><label><input type="radio" name="cards[1c719ca9-5069-4afe-9e82-39ca00000000][field0]" value="No" /><span class="application-answer-alternative">No</span></label></li>
        </ul></div></div></li>
      <li class="application-question custom-question"><div><div class="application-label full-width text"><div class="text">Why do you want to work at Acme?</div></div>
        <div class="application-field full-width"><textarea class="card-field-input" name="cards[ce72d538-c9ad-41f3-8e9a-618d00000000][field0]" maxlength="1000"></textarea></div></div></li>
      <li class="application-question custom-question"><div><div class="application-label full-width dropdown"><div class="text">Please tell us how you heard about this opportunity.<span class="required">✱</span></div></div>
        <div class="application-field full-width required-field"><select name="cards[a6197d84-549e-4a91-8bb0-6af900000000][field0]" required>
          <option value="">Select...</option><option value="LinkedIn">LinkedIn</option><option value="Welcome to the Jungle">Welcome to the Jungle</option><option value="Other">Other</option>
        </select></div></div></li>
    </ul>
  </div>
  <div class="section page-centered application-form" data-qa="additional-cards">
    <ul>
      <li class="application-question"><label><div class="application-label">Additional information</div>
        <div class="application-field"><textarea name="comments" placeholder="Add a cover letter or anything else you want to share."></textarea></div></label></li>
    </ul>
  </div>
  <div class="section page-centered application-form eeo-section">
    <ul>
      <li class="application-question"><label><div class="application-label">Gender</div>
        <div class="application-field"><select name="eeo[gender]"><option value="">Select ...</option><option value="Male">Male</option><option value="Female">Female</option><option value="Decline to self-identify">Decline to self-identify</option></select></div></label></li>
    </ul>
  </div>
  <button type="submit" class="postings-btn template-btn-submit">Submit application</button>
</form>
</div>
<script>window.__lever = {"ignore": "this"};</script>
</body>
</html>
